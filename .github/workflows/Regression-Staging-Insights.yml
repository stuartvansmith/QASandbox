name: QA - Regression Staging Insights
on:
    workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Debug
      - name: Restore Playwright auth state
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path SSO | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.AUTH_STATE_RESTRICTED_ACCESS }}")
          [IO.File]::WriteAllBytes("SSO\authState.json", $bytes)
      - name: Install Playwright browsers
        shell: pwsh
        run: |
          .\bin\Debug\net8.0\playwright.ps1 install chromium
     
      - name: Test (only insights test Class)
        shell: pwsh
        run: |
          dotnet vstest bin\Debug\net8.0\QA.AutomationTests.dll `
            /TestCaseFilter:"FullyQualifiedName~QA.AutomationTests.RegressionTests.InsightsModule" `
            /Logger:"trx;LogFileName=test-results.trx"
        env:
          TEST_BASE_URL: "https://staging.originbenefits.ai"
          TEST_TENANT: "Smoke Test"
  
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
      - name: Upload network logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: network-logs
         path: network-logs/**
         retention-days: 90
      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-videos/**
          retention-days: 30
      - name: Upload network logs to Blob Storage
        if: always()
        shell: pwsh
        run: |
            $body = @{
            grant_type    = "client_credentials"
            client_id     = "${{ secrets.AZURE_CLIENT_ID }}"
            client_secret = "${{ secrets.AZURE_CLIENT_SECRET }}"
            scope         = "https://storage.azure.com/.default"
            }
            $tokenResponse = Invoke-RestMethod `
            -Uri "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" `
            -Method POST -Body $body
            $token = $tokenResponse.access_token

            $account = "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
            $container = "browsernetworklogs"

            $files = Get-ChildItem -Path "network-logs" -Recurse -File
            foreach ($file in $files) {
            $uri = "https://$account.blob.core.windows.net/$container/$($file.Name)"
            
            $fileBytes = [System.IO.File]::ReadAllBytes($file.FullName)
            Invoke-RestMethod -Uri $uri -Method PUT `
                -Headers @{
                Authorization    = "Bearer $token"
                "x-ms-blob-type" = "BlockBlob"
                "x-ms-version"   = "2020-10-02"
                "Content-Type"   = "text/csv"
                } `
                -Body $fileBytes
            }
          
            Write-Host "All files uploaded to Blob Storage"